version: '3.8'

services:
  # 1. Nuestro Panel Unificado + Motor de Bot de 6 Opciones
  omnipanel:
    build: .
    container_name: omnipanel_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=omnipanel_secret_key
      - EVOLUTION_INSTANCE=whatsapp_principal
    depends_on:
      - evolution_api

  # 2. Gateway Gratuito para WhatsApp Normal (Escaneo por Código QR)
  evolution_api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=omnipanel_secret_key
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - redis

  # 3. Redis para Sesiones y Deduplicación
  redis:
    image: redis:7-alpine
    container_name: omnipanel_redis
    restart: always

volumes:
  evolution_instances:
